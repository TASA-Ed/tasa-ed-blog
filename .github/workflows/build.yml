name: Build and Check

on:
  push:
    branches: [ master ] # Adjust branches as needed
  pull_request:
    branches: [ master ] # Adjust branches as needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        node: [ 26 ]
    runs-on: ubuntu-latest
    name: Astro Check for Node.js ${{ matrix.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false # Disable auto-install
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }} # Use LTS
          # 缓存 pnpm 依赖
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro Check
        run: pnpm astro check

      - name: Run Markdown Lint
        run: pnpm markdownlint-cli2 "**/*.md"

  build:
    strategy:
      matrix:
        node: [ 26 ]
    runs-on: ubuntu-latest
    name: Astro Build for Node.js ${{ matrix.node }} # Corrected job name
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create .env file
        run: echo "MEILI_MASTER_KEY=${{ secrets.MEILI_MASTER_KEY }}" > .env

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false # Disable auto-install
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # 缓存 pnpm 依赖
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Generate Icons
        run: node scripts/generate-icons.js

      - name: Run Astro Build
        run: pnpm astro build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Deploy to server via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: "/tmp/blogdy-temp"
          strip_components: 1
          rm: true

      - name: Execute remote commands
        uses: appleboy/ssh-action@v1
        env:
          INDEX_DIR: ${{ secrets.DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: INDEX_DIR
          script: |
            set -e

            if [ ! -d "/$INDEX_DIR/index/blog/" ]; then exit 1; fi
            
            # 清除目标目录
            sudo rm -rf /$INDEX_DIR/index/blog/*

            # 移动文件到目标目录
            sudo mv /tmp/blogdy-temp/* /$INDEX_DIR/index/blog/

            # 更改所有者和用户组
            sudo chown -R 1000:1000 /$INDEX_DIR/index/blog/

            # 清理临时目录
            rm -rf /tmp/blogdy-temp

            echo "Deployment completed successfully!"

